server {
    listen 8080;
    server_name _;

    # Swagger UI static files (from the swaggerapi/swagger-ui image)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # ---- api-docs (force springdoc to render server URLs as localhost:8090) ----
    location = /api-docs/product-service {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8500/product-service/v3/api-docs;
    }
    location = /api-docs/user-service {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8700/user-service/v3/api-docs;
    }
    location = /api-docs/order-service {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8300/order-service/v3/api-docs;
    }
    location = /api-docs/payment-service {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8400/payment-service/v3/api-docs;
    }
    location = /api-docs/shipping-service {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8600/shipping-service/v3/api-docs;
    }
    location = /api-docs/favourite-service {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8800/favourite-service/v3/api-docs;
    }

    # ---- actual API traffic for "Execute" buttons (same-origin) ----
    location /product-service/ {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8500;
    }
    location /user-service/ {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8700;
    }
    location /order-service/ {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8300;
    }
    location /payment-service/ {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8400;
    }
    location /shipping-service/ {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8600;
    }
    location /favourite-service/ {
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8800;
    }
}
